<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aset Gerhana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --malam: #0f0d1f; --nila-tua: #1e1b3a; --nila: #2f3a6b; --kabut: #5b6e99;
    --perak: #a9b8cf; --putih: #ece6d6; --prada: #e8b83a; --merah: #c23a2b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--nila-tua); color: var(--putih); font: 16px/1.5 "Pixelify Sans", system-ui, sans-serif; }
  img, .anim { image-rendering: pixelated; }
  header { display: grid; gap: 16px; padding: 32px 16px 24px; max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 40px; line-height: 1.1; font-weight: 600; margin: 0; color: var(--prada); }
  header p { margin: 0; max-width: 62ch; color: var(--perak); }
  .hero { width: 100%; max-width: 1040px; border: 2px solid var(--malam); outline: 2px solid var(--prada); }
  main { max-width: 1040px; margin: 0 auto; padding: 0 16px 64px; }
  h2 { font-size: 24px; font-weight: 600; margin: 40px 0 4px; color: var(--prada); }
  h2 + p { margin: 0 0 16px; color: var(--perak); max-width: 62ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  figure { margin: 0; padding: 12px; background: var(--malam); border-left: 2px solid var(--nila); display: grid; gap: 8px; align-content: start; }
  figure .stage { display: grid; place-items: center; min-height: 96px; }
  figure .stage img { max-width: 100%; height: auto; }
  figcaption { font-size: 14px; line-height: 1.3; }
  figcaption small { display: block; color: var(--perak); }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .swatch { display: grid; grid-template-rows: 48px auto; background: var(--malam); font-size: 14px; }
  .swatch span { padding: 4px 8px; }
  a { color: var(--prada); }
  a:focus-visible { outline: 2px solid var(--prada); outline-offset: 2px; }
  @keyframes play { to { background-position-x: calc(var(--sheet) * -1); } }
  .anim { background-repeat: no-repeat; animation: play var(--dur) steps(var(--n)) infinite; }
  @media (prefers-reduced-motion: reduce) { .anim { animation: none; } }
</style>
<header>
  <h1>Aset Gerhana</h1>
  <p>Semua aset visual MVP: 2 pendekar, 9 makhluk, kartu, ikon, peta, UI, dan background. Resolusi dasar 320×180, ditampilkan diperbesar. Gambar di bawah ini disusun dari aset asli untuk mengecek skala layar combat.</p>
  <img class="hero" src="out/mockup/combat.png" alt="Mockup layar combat: dua pendekar melawan tuyul, kuntilanak, dan pocong di Hutan Larangan, dengan empat kartu di tangan.">
</header>
<main id="main"><p>Memuat aset…</p></main>
<script>
const GROUPS = [
  ["heroes", "Pendekar", "Menghadap kanan. Setiap karakter punya still, idle (2 frame), attack (4), dan hit (2)."],
  ["enemies", "Makhluk", "Menghadap kiri. Elite 48 px, Banaspati 64 px dengan versi fase 2 yang lebih panas."],
  ["cards", "Kartu", "Bingkai per jenis kartu, versi upgrade berbingkai prada, dan sisi belakang."],
  ["card_art", "Gambar kartu", "Untuk 6 kartu awal. Kartu hadiah dibuat setelah daftarnya final di M1."],
  ["icons", "Ikon", "Status, niat musuh, sumber daya, dan ping. 12 px."],
  ["map", "Node peta", "16 px."],
  ["ui", "UI", "Panel dan tombol 9-slice, bar, dan timer gerhana yang menghitung 30 detik giliran."],
  ["backgrounds", "Background", "320×180. Kaki karakter berdiri di garis y = 112."],
];
const wide = a => a.frames === 1 && a.w >= 320;
// largest whole-pixel scale whose frame still fits a ~126px tile (backgrounds get a full row at 2x)
const scaleFor = a => wide(a) ? 2 : Math.max(1, Math.min(6, Math.floor(126 / (a.w / a.frames))));

function tile(a) {
  const fig = document.createElement("figure");
  if (wide(a)) fig.style.gridColumn = "1 / -1";
  const s = scaleFor(a), fw = a.w / a.frames;
  const stage = document.createElement("div");
  stage.className = "stage";
  if (a.frames > 1) {
    const d = document.createElement("div");
    d.className = "anim";
    d.role = "img";
    d.ariaLabel = a.name;
    Object.assign(d.style, {
      width: fw * s + "px", height: a.h * s + "px",
      backgroundImage: `url(out/${a.file})`, backgroundSize: `${a.w * s}px ${a.h * s}px`,
    });
    d.style.setProperty("--sheet", a.w * s + "px");
    d.style.setProperty("--n", a.frames);
    d.style.setProperty("--dur", a.name.includes("timer") ? "4s" : a.name.endsWith("idle") ? "1s" : "0.6s");
    stage.append(d);
  } else {
    const img = new Image(a.w * s, a.h * s);
    img.src = "out/" + a.file;
    img.alt = a.name;
    stage.append(img);
  }
  const cap = document.createElement("figcaption");
  cap.innerHTML = `<a href="out/${a.file}">${a.name}</a><small>${a.note}</small>`;
  fig.append(stage, cap);
  return fig;
}

fetch("out/manifest.json").then(r => r.json()).then(({ palette, assets }) => {
  const main = document.getElementById("main");
  main.innerHTML = `<h2>Palet</h2><p>21 warna, dipakai semua aset. Nama warna sama dengan yang ada di kode generator.</p>`;
  const sw = document.createElement("div");
  sw.className = "swatches";
  for (const [name, hex] of Object.entries(palette))
    sw.insertAdjacentHTML("beforeend", `<div class="swatch"><div style="background:#${hex}"></div><span>${name}<br><small>#${hex}</small></span></div>`);
  main.append(sw);
  for (const [group, title, desc] of GROUPS) {
    main.insertAdjacentHTML("beforeend", `<h2>${title}</h2><p>${desc}</p>`);
    const grid = document.createElement("div");
    grid.className = "grid";
    assets.filter(a => a.group === group).forEach(a => grid.append(tile(a)));
    main.append(grid);
  }
}).catch(() => {
  document.getElementById("main").innerHTML = "<p>manifest.json tidak terbaca. Jalankan <code>python3 build.py</code>, lalu buka halaman ini lewat server lokal, bukan file://.</p>";
});
</script>
</html>
